<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Criativa</title>
  <link rel="stylesheet" href="style_login.css">
  <link rel="shortcut icon" href="https://www.teamcriativa.com/ICONES/favicon.ico" type="image/x-icon">
  <script src="https://unpkg.com/phosphor-icons"></script>
</head>
<body>
  <div id="bg"></div>
  <img id="logo">

  <!-- FORM LOGIN -->
  <div class="login-container">
    <h2>Entrar</h2>
    <form id="loginForm">
      <div class="input-group">
        <i class="ph-envelope"></i>
        <input type="email" id="email" placeholder="E-mail" required>
      </div>
      <div class="input-group">
        <i class="ph-lock"></i>
        <input type="password" id="password" placeholder="Senha" required>
      </div>
      <button type="submit">Login</button>
      <a id="forgot-link">Esqueceu sua senha?</a>
      <div class="forgot-box" id="forgot-box">
        <i class="ph-info"></i> Entre em contato com o administrador.
      </div>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script src="BG.js"></script>
  <script src="https://www.teamcriativa.com/SCRIPTS/logo.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
